<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#f6f6f7" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="ProcrastiMate" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<title>ProcrastiMate</title>
		<script>
			// Runs before first paint so the page never flashes the other theme. `src/lib/theme.svelte.ts` owns the keys, the choices,
			// and the theme-color values. Without a saved accent, `accents.css` paints the default one; a custom one brings its rules.
			try {
				const choice = localStorage.getItem('procrastimate-theme');
				const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				const accent = localStorage.getItem('procrastimate-accent');
				if (accent) document.documentElement.dataset.accent = accent[0] === '#' ? 'custom' : accent;
				const customCss = accent && accent[0] === '#' && localStorage.getItem('procrastimate-accent-css');
				if (customCss) {
					const style = document.createElement('style');
					style.id = 'custom-accent';
					style.textContent = customCss;
					document.head.append(style);
				}
				document.querySelector('meta[name="theme-color"]').content = dark ? '#0e0e10' : '#f6f6f7';
			} catch {}
		</script>
		<style>
			html {
				color-scheme: light;
			}

			html[data-theme='dark'] {
				color-scheme: dark;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
