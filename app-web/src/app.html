<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#f6f6f7" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Procrastimate" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<title>Procrastimate</title>
		<script>
			// Runs before first paint so the page never flashes the other theme. `src/lib/theme.svelte.ts` owns the key, the choice,
			// and the theme-color values.
			try {
				const choice = localStorage.getItem('procrastimate-theme');
				const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				document.querySelector('meta[name="theme-color"]').content = dark ? '#0e0e10' : '#f6f6f7';
			} catch {}
		</script>
		<style>
			html {
				color-scheme: light;
			}

			html[data-theme='dark'] {
				color-scheme: dark;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
