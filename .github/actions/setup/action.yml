name: Setup
description: Install Bun and dependencies.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # app-web asks for feedback-engine at `latest`, which the lockfile alone would freeze, so every build and deploy
    # takes the newest release.
    - name: Take the latest feedback-engine
      shell: bash
      run: bun update --filter app-web @stefan.inc/feedback-engine
