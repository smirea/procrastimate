name: Setup
description: Install Bun, dependencies, and generated env files.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Generate env
      shell: bash
      run: |
        bun add -g github:smirea/env-manager#58f810aa4662ba5fdfd811a106dd1a53e65db5f4
        # CI has no AWS credentials. `--local` means schema defaults, not an environment named local.
        # Only the env marker: a project header here makes env-manager treat the values file as another root.
        printf '# env-manager env: dev\n' > .env.local
        env-manager gen --local
