name: iOS

# Separate from ci.yml so it never slows the web checks or blocks the Worker deploy.
# Every job runs on a pull request that can change the app, and on a manual workflow_dispatch. Master
# skips them, since the pull request already ran them and TestFlight archives every such merge. Skipping
# with `if` still reports the check (a skip counts as success), so a required check of that name does
# not stay pending the way a workflow-level path filter would. A web-only change runs none of them:
# `scripts/app-paths.txt` includes `shared/`, so every change the Swift tests replay still runs them.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC

jobs:
  # The paths that change the app's Swift: its sources, the shared schemas and CSS tokens it is generated from, and the
  # generator with its dependencies.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            touched=$(git diff --name-only "$BASE" HEAD | grep -f scripts/app-paths.txt -e '^\.github/workflows/ios\.yml$' || true)
            printf '%s\n' "$touched"
            echo "app=$([ -n "$touched" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # API.swift is git-ignored, so every Swift job builds against the one this job writes.
  # core-linux's Swift container has no bun, which is why this is an artifact rather than a step per job.
  generate:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run generate

      - uses: actions/upload-artifact@v4
        with:
          name: generated-swift
          path: app-ios/Sources/Core/Generated
          if-no-files-found: error

  core:
    needs: [changes, generate]
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: generated-swift
          path: app-ios/Sources/Core/Generated

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Core tests
        run: swift test

  core-linux:
    needs: [changes, generate]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4.1
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: generated-swift
          path: app-ios/Sources/Core/Generated

      # The default Swift Build backend segfaults on Linux while planning, about once in 60 runs, before any of our code
      # compiles: swiftlang/swift-build#1786, a libdispatch use-after-free. swift-build-1786.yml fails once a release fixes it.
      - name: Core tests
        run: swift test --build-system native

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-ios
    steps:
      # Full history: Core's Generate phase counts the commits for the version the Info.plist carries.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Nothing generates before the build, so it proves a fresh clone builds in one pass: Core's Generate phase writes
      # API.swift, Tokens.swift, and the AccentColor asset with the root's dependencies.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Toolchain
        run: xcodebuild -version

      # The resolved packages: every package's checkout and the extracted Sentry xcframework.
      # With them in place the resolve below takes seconds and needs no network; on a miss it downloads and extracts
      # everything again, which took about a minute. The key is Package.resolved, which pins every remote package, and the
      # local packages' manifests, which pin Sentry. No restore-keys: a stale directory would resolve over old versions.
      # testflight.yml saves the same key on master, which every PR can read.
      - uses: actions/cache@v4
        with:
          path: app-ios/SourcePackages
          key: source-packages-${{ runner.os }}-${{ hashFiles('app-ios/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'app-ios/Packages/*/Package.swift') }}

      # One clone directory for every xcodebuild below and the cache above.
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath SourcePackages

      # No AWS here. Debug gets the dev schema default; Release is pinned in Base.xcconfig.
      - name: Debug and Release env
        working-directory: ${{ github.workspace }}
        run: bun server/scripts/secrets.ts ios --generate-only

      # One -showBuildSettings per configuration: each call loads the package graph again, which takes seconds.
      - name: Debug calls dev and Release calls prod, and only Release reports to Sentry, with dSYMs
        run: |
          xcodebuild -showBuildSettings -project App.xcodeproj -target App -configuration Debug -clonedSourcePackagesDirPath SourcePackages > "$RUNNER_TEMP/debug.txt"
          xcodebuild -showBuildSettings -project App.xcodeproj -target App -configuration Release -clonedSourcePackagesDirPath SourcePackages > "$RUNNER_TEMP/release.txt"
          setting() { awk -v key="$2" '$1 == key { print $3 }' "$RUNNER_TEMP/$1.txt"; }
          echo "Debug API_URL=$(setting debug API_URL)"
          echo "Release API_URL=$(setting release API_URL)"
          test "$(setting debug API_URL)" = http://127.0.0.1:6121
          test "$(setting release API_URL)" = https://procrastimate.stf.lol
          test -z "$(setting debug SENTRY_ENVIRONMENT)"
          test "$(setting release SENTRY_ENVIRONMENT)" = production
          test "$(setting release DEBUG_INFORMATION_FORMAT)" = dwarf-with-dsym

      - name: Build
        run: >
          xcodebuild build -quiet -project App.xcodeproj -scheme App
          -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages
          CODE_SIGNING_ALLOWED=NO

      - name: App bundles its privacy manifest
        run: |
          app=$(find DerivedData/Build/Products -name App.app -type d | head -1)
          test -n "$app"
          plutil -lint "$app/PrivacyInfo.xcprivacy"

      - name: App and widgets carry this commit's version
        run: |
          app=$(find DerivedData/Build/Products -name App.app -type d | head -1)
          version=$(bun ../scripts/app-version.mts)
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/PlugIns/Widgets.appex/Info.plist")" = "$version"
