name: iOS

# Separate from ci.yml so it never slows the web checks or blocks the Worker deploy.
# macOS `core` and `app` are off on pull requests and on master until they are turned back on
# before a release. A manual workflow_dispatch runs them. Skipping those jobs with `if` still
# reports the check (a skip counts as success), so a required check of that name does not stay
# pending the way a workflow-level path filter would. `core-linux` still runs every time.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC

jobs:
  core:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Core tests
        run: swift test

  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - name: Core tests
        run: swift test

  app:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Generated colors match index.css
        run: bun scripts/tokens.ts --check

      - name: Toolchain
        run: xcodebuild -version

      # No AWS here. Debug gets the dev schema default; Release is pinned in Base.xcconfig.
      - name: Debug and Release env
        working-directory: ${{ github.workspace }}
        run: bun server/scripts/secrets.ts ios --generate-only

      - name: Debug calls dev and Release calls prod
        run: |
          debug=$(xcodebuild -showBuildSettings -project App.xcodeproj -target App -configuration Debug | awk '$1 == "API_URL" { print $3 }')
          release=$(xcodebuild -showBuildSettings -project App.xcodeproj -target App -configuration Release | awk '$1 == "API_URL" { print $3 }')
          echo "Debug API_URL=$debug"
          echo "Release API_URL=$release"
          test "$debug" = http://127.0.0.1:6121
          test "$release" = https://procrastimate.stf.lol

      - name: Build
        run: >
          xcodebuild build -quiet -project App.xcodeproj -scheme App
          -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO

      - name: App bundles its privacy manifest
        run: |
          app=$(find DerivedData/Build/Products -name App.app -type d | head -1)
          test -n "$app"
          plutil -lint "$app/PrivacyInfo.xcprivacy"
