name: iOS

# Separate from ci.yml so it never slows the web checks or blocks the Worker deploy.
# The macOS `core` and `app` jobs run on a pull request that can change the app, and on a manual
# workflow_dispatch. Master skips them, since TestFlight archives every such merge. Skipping with
# `if` still reports the check (a skip counts as success), so a required check of that name does not
# stay pending the way a workflow-level path filter would. `core-linux` runs every time.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC

jobs:
  # The paths that change the app's Swift: its sources, the shared schemas and CSS tokens it is generated from, and the
  # generator with its dependencies.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            touched=$(git diff --name-only "$BASE" HEAD | grep -e '^app-ios/' -e '^shared/' -e '^scripts/generate/' -e '^app-web/src/index\.css$' -e '^package\.json$' -e '^bun\.lock$' -e '^\.github/workflows/ios\.yml$' || true)
            printf '%s\n' "$touched"
            echo "app=$([ -n "$touched" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # API.swift is git-ignored, so every Swift job builds against the one this job writes.
  # core-linux's Swift container has no bun, which is why this is an artifact rather than a step per job.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - run: bun run generate

      - uses: actions/upload-artifact@v4
        with:
          name: generated-swift
          path: app-ios/Sources/Core/Generated
          if-no-files-found: error

  core:
    needs: [changes, generate]
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: generated-swift
          path: app-ios/Sources/Core/Generated

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Core tests
        run: swift test

  core-linux:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: generated-swift
          path: app-ios/Sources/Core/Generated

      - name: Core tests
        run: swift test

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Nothing generates before the build, so it proves a fresh clone builds in one pass: Core's Generate phase writes
      # API.swift, Tokens.swift, and the AccentColor asset with the root's dependencies.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Toolchain
        run: xcodebuild -version

      # No AWS here. Debug gets the dev schema default; Release is pinned in Base.xcconfig.
      - name: Debug and Release env
        working-directory: ${{ github.workspace }}
        run: bun server/scripts/secrets.ts ios --generate-only

      - name: Debug calls dev and Release calls prod
        run: |
          debug=$(xcodebuild -showBuildSettings -project App.xcodeproj -target App -configuration Debug | awk '$1 == "API_URL" { print $3 }')
          release=$(xcodebuild -showBuildSettings -project App.xcodeproj -target App -configuration Release | awk '$1 == "API_URL" { print $3 }')
          echo "Debug API_URL=$debug"
          echo "Release API_URL=$release"
          test "$debug" = http://127.0.0.1:6121
          test "$release" = https://procrastimate.stf.lol

      - name: Build
        run: >
          xcodebuild build -quiet -project App.xcodeproj -scheme App
          -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO

      - name: App bundles its privacy manifest
        run: |
          app=$(find DerivedData/Build/Products -name App.app -type d | head -1)
          test -n "$app"
          plutil -lint "$app/PrivacyInfo.xcprivacy"
