name: iOS

# Separate from ci.yml so it never slows the web checks or blocks the Worker deploy.
# Every job runs on a pull request that can change the app, and on a manual workflow_dispatch. Master
# skips them, since the pull request already ran them and TestFlight archives every such merge. Skipping
# with `if` still reports the check (a skip counts as success), so a required check of that name does
# not stay pending the way a workflow-level path filter would. A web-only change runs none of them:
# `scripts/app-paths.txt` includes `shared/`, so every change the Swift tests replay still runs them.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC

jobs:
  # The paths that change the app's Swift: its sources, the shared schemas and CSS tokens it is generated from, and the
  # generator with its dependencies.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            touched=$(git diff --name-only "$BASE" HEAD | grep -f scripts/app-paths.txt -e '^\.github/workflows/ios\.yml$' || true)
            printf '%s\n' "$touched"
            echo "app=$([ -n "$touched" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # API.swift is git-ignored, so every Swift job builds against the one this job writes.
  # core-linux's Swift container has no bun, which is why this is an artifact rather than a step per job.
  generate:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - run: bun run generate

      - uses: actions/upload-artifact@v4
        with:
          name: generated-swift
          path: app-ios/Sources/Core/Generated
          if-no-files-found: error

  core:
    needs: [changes, generate]
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: generated-swift
          path: app-ios/Sources/Core/Generated

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Core tests
        run: swift test

  core-linux:
    needs: [changes, generate]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4.1
    defaults:
      run:
        working-directory: app-ios
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: generated-swift
          path: app-ios/Sources/Core/Generated

      # The default Swift Build backend segfaults on Linux while planning, about once in 60 runs, before any of our code
      # compiles: swiftlang/swift-build#1786, a libdispatch use-after-free. Drop the flag once a release fixes it.
      - name: Core tests
        run: swift test --build-system native

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-ios
    steps:
      # Full history: Core's Generate phase counts the commits for the version the Info.plist carries.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Nothing generates before the build, so it proves a fresh clone builds in one pass: Core's Generate phase writes
      # API.swift, Tokens.swift, and the AccentColor asset with the root's dependencies.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Toolchain
        run: xcodebuild -version

      # sentry-cocoa's xcframework zips (about 800 MB) download from GitHub releases on a cold resolve, and that download
      # timed out a build. SwiftPM keeps them and every package's git clone in its shared cache, which resolves fully offline
      # when warm. The key is Package.resolved, which pins every package. No restore-keys: the shared cache never prunes, so
      # a dependency change downloads once instead of carrying the old versions forward. testflight.yml saves the same key
      # on master, which every PR can read.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('app-ios/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # One clone directory for every xcodebuild below, so the packages extract once instead of once per call.
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath SourcePackages

      # No AWS here. Debug gets the dev schema default; Release is pinned in Base.xcconfig.
      - name: Debug and Release env
        working-directory: ${{ github.workspace }}
        run: bun server/scripts/secrets.ts ios --generate-only

      - name: Debug calls dev and Release calls prod
        run: |
          debug=$(xcodebuild -showBuildSettings -project App.xcodeproj -target App -configuration Debug -clonedSourcePackagesDirPath SourcePackages | awk '$1 == "API_URL" { print $3 }')
          release=$(xcodebuild -showBuildSettings -project App.xcodeproj -target App -configuration Release -clonedSourcePackagesDirPath SourcePackages | awk '$1 == "API_URL" { print $3 }')
          echo "Debug API_URL=$debug"
          echo "Release API_URL=$release"
          test "$debug" = http://127.0.0.1:6121
          test "$release" = https://procrastimate.stf.lol

      - name: Only Release reports to Sentry, with dSYMs
        run: |
          settings() { xcodebuild -showBuildSettings -project App.xcodeproj -target App -configuration "$1" -clonedSourcePackagesDirPath SourcePackages | awk -v key="$2" '$1 == key { print $3 }'; }
          test -z "$(settings Debug SENTRY_ENVIRONMENT)"
          test "$(settings Release SENTRY_ENVIRONMENT)" = production
          test "$(settings Release DEBUG_INFORMATION_FORMAT)" = dwarf-with-dsym

      - name: Build
        run: >
          xcodebuild build -quiet -project App.xcodeproj -scheme App
          -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages
          CODE_SIGNING_ALLOWED=NO

      - name: App bundles its privacy manifest
        run: |
          app=$(find DerivedData/Build/Products -name App.app -type d | head -1)
          test -n "$app"
          plutil -lint "$app/PrivacyInfo.xcprivacy"

      - name: App and widgets carry this commit's version
        run: |
          app=$(find DerivedData/Build/Products -name App.app -type d | head -1)
          version=$(bun ../scripts/app-version.mts)
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/PlugIns/Widgets.appex/Info.plist")" = "$version"
