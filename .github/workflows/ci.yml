name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The schema defaults the env readers require. Nothing here is secret; the deploy's secrets are repository secrets.
env:
  API_URL: http://127.0.0.1:6121
  API_PORT: 6121
  CLIENT_PORT: 6120

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: scripts/app-version.mts counts the commits for the version the build shows.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # drizzle-kit writes a new migration when the schema has changed without one.
      - name: Migrations match the schema
        run: |
          bunx drizzle-kit generate
          stale=$(git status --porcelain server/drizzle)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::server/drizzle is missing a migration. Run 'bun run db:generate' and commit the result."
            exit 1
          fi

      # A push compares with the master it replaced, since origin/master is then the commit under test.
      - name: Migrations extend master's history
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'master' }}
        run: |
          git fetch --no-tags origin "+$BASE:refs/remotes/ci/base"
          bun server/scripts/migration-history.ts ci/base

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun test

      # porcelain also lists new, untracked vector files, which git diff would miss.
      - name: Test vectors are up to date
        run: |
          bun run vectors
          stale=$(git status --porcelain shared/vectors)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::shared/vectors is stale. Run 'bun run vectors' and commit the result."
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Validate Worker bundle
        run: bunx wrangler deploy --dry-run

  e2e:
    runs-on: ubuntu-latest
    # Desktop Chromium on two workers and the nine @webkit tests on one worker each take a few minutes.
    timeout-minutes: 25
    name: e2e
    steps:
      # Full history: scripts/app-version.mts counts the commits for the version the build shows.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: app-web

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: bunx playwright install chromium webkit
        working-directory: app-web

      # The Ubuntu mirror sometimes takes minutes per package, which once ate the whole job. apt keeps every deb it
      # downloads in a cached directory, so a warm run installs from disk and only fetches what the image's update changed.
      - name: Keep apt downloads in a cacheable directory
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf '%s\n' \
            "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            'APT::Sandbox::User "root";' \
            | sudo tee /etc/apt/apt.conf.d/90-ci-cache

      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ env.ImageOS }}-${{ env.ImageVersion }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: apt-${{ env.ImageOS }}-

      - name: Install Playwright system dependencies
        id: install-deps
        timeout-minutes: 5
        run: bunx playwright install-deps chromium webkit
        working-directory: app-web

      # apt writes its lock and half-fetched debs readable by root only, which the cache's tar runs as the runner user.
      - name: Prepare apt packages for the cache
        if: always() && steps.apt-cache.outputs.cache-hit != 'true' && steps.install-deps.outcome != 'skipped'
        env:
          INSTALLED: ${{ steps.install-deps.outcome == 'success' }}
        run: |
          if [ "$INSTALLED" = true ]; then sudo apt-get autoclean; fi
          sudo chmod -R a+rX ~/.cache/apt-archives

      # Saved right away rather than at the end of the job, so a failing test run still warms the cache. An install that
      # timed out saves what it fetched under a per-run key the restore prefix matches, so the rerun resumes from there.
      - name: Cache apt packages
        if: always() && steps.apt-cache.outputs.cache-hit != 'true' && steps.install-deps.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/apt-archives
          key: >-
            ${{ steps.apt-cache.outputs.cache-primary-key }}${{ steps.install-deps.outcome != 'success'
            && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}

      # The same Postgres and PowerSync containers a worktree runs, on the main checkout's e2e ports.
      - name: Postgres and PowerSync
        run: bun scripts/ci-stack.ts

      # The lock tests need two connections, which PGlite cannot give the unit run; this is the one job with a Postgres.
      - name: Advisory lock tests
        run: DATABASE_URL="$(grep '^DATABASE_URL=' .env.override | cut -d= -f2-)" REQUIRE_DATABASE=1 bun test server/src/sharing-lock.test.ts

      - name: End to end against the Worker, desktop Chromium
        id: desktop
        run: bun run test:e2e --project desktop
        env:
          E2E_WORKER: '1'

      # One worker: each WebKit test drives two or three pages, and Linux WebKit on two cores beside a second worker's
      # pages rendered so slowly that the longest specs crossed their limits in 3 of 3 runs, a different spec each time.
      - name: End to end against the Worker, mobile WebKit
        if: (success() || failure()) && steps.desktop.outcome != 'skipped'
        run: bun run test:e2e --project mobile --workers 1 --output test-results/mobile
        env:
          E2E_WORKER: '1'

      - name: PowerSync logs
        if: failure()
        run: docker ps -a --filter label=procrastimate.worktree --format '{{.Names}}' | xargs -rn1 docker logs

      # Traces of the failed specs. They hold only the throwaway accounts each spec signs up.
      - name: Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: app-web/test-results
          retention-days: 7

  deploy:
    needs: [checks, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      SENTRY_ORG: self-uo7
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        # Full history, so set-commits can list the commits since the previous release.
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Sentry auth token
        if: env.HAS_CLOUDFLARE == 'true' && env.HAS_SENTRY != 'true'
        run: |
          echo "::error::Add the SENTRY_AUTH_TOKEN repository secret with 'bun run secrets:github'. The deploy uploads source maps to Sentry with it."
          exit 1

      # SENTRY_ENVIRONMENT turns reporting on; the build fails while shared/sentry.ts has no web DSN.
      - name: Build
        if: env.HAS_CLOUDFLARE == 'true'
        run: bun run build
        env:
          SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Required Worker secrets
        if: env.HAS_CLOUDFLARE == 'true'
        run: bun server/scripts/secrets.ts verify
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Bundled first and deployed with --no-bundle, so the code Sentry's debug ids are injected into is the code that runs.
      - name: Bundle the Worker
        if: env.HAS_CLOUDFLARE == 'true'
        run: bunx wrangler deploy --dry-run --outdir .wrangler/deploy

      # The web maps are deleted after the upload so the Worker never serves them.
      - name: Sentry release and source maps
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          bunx sentry-cli releases new -p procrastimate-web -p procrastimate-worker "$RELEASE"
          bunx sentry-cli releases set-commits "$RELEASE" --auto --ignore-missing
          bunx sentry-cli sourcemaps inject app-web/build .wrangler/deploy
          bunx sentry-cli sourcemaps upload -p procrastimate-web --release "$RELEASE" app-web/build
          bunx sentry-cli sourcemaps upload -p procrastimate-worker --release "$RELEASE" .wrangler/deploy
          find app-web/build -name '*.map' -delete

      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        run: >-
          bunx wrangler deploy -c wrangler.jsonc --no-bundle .wrangler/deploy/worker.js
          --var SENTRY_ENVIRONMENT:production --var "SENTRY_RELEASE:$RELEASE"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sentry deploy
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          bunx sentry-cli releases finalize "$RELEASE"
          bunx sentry-cli deploys new --release "$RELEASE" -e production

      - name: Deploy skipped
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "::error::Not deployed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets with 'bun run secrets:github'."
          exit 1
