name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate env
        run: |
          bun add -g github:smirea/env-manager#60f8b982a945291f9df2e3c4a77830fdd228ae27
          env-manager gen --local

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Validate Worker bundle
        run: bunx wrangler deploy --dry-run

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit
        working-directory: app-web

      - name: VAPID keys for wrangler dev
        run: bun server/scripts/vapid.ts dev-vars

      - name: End to end against the Worker
        run: bun run test:e2e
        env:
          E2E_WORKER: '1'

      - name: Deploy
        if: github.event_name == 'push' && env.HAS_CLOUDFLARE == 'true'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Provision VAPID keys
        if: github.event_name == 'push' && env.HAS_CLOUDFLARE == 'true'
        run: bun server/scripts/vapid.ts ensure
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy skipped
        if: github.event_name == 'push' && env.HAS_CLOUDFLARE != 'true'
        run: echo "::warning::Not deployed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
