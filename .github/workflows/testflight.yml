name: TestFlight

# Archives Release on a GitHub macOS runner and uploads it to App Store Connect, so TestFlight builds never need
# Stefan's Mac. Internal group `me` has access to all builds, so every upload reaches it without an extra step.
# Never runs on pull requests: macOS runners queue, and PR checks stay fast.
# Pushes share one concurrency group and cancel the run already in progress. The debounce job waits ten minutes,
# then skips the archive only when a newer commit touched the paths below, because that commit has its
# own run. A later web or server commit leaves this run to archive, because the path filter would not start one.
# A manual workflow_dispatch does not wait.
on:
  push:
    branches: [master]
    # scripts/generate writes API.swift from shared/ and the colors from index.css with the root's dependencies, so those
    # paths change the app too. Actions cannot read a file here, so this list repeats scripts/app-paths.txt.
    paths:
      - app-ios/**
      - shared/**
      - app-web/src/index.css
      - scripts/generate/**
      - scripts/app-version.mts
      - package.json
      - bun.lock
      - .github/workflows/testflight.yml
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      # Checked before the ten-minute wait and the archive: a build whose dSYMs never reach Sentry ships crashes nobody
      # can read.
      - name: Sentry auth token
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not set; run bun run secrets:github"
            exit 1
          fi

      # Full history so the gate can see commits that landed on master during the wait.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The wait stays off the xcode-27 runner, which queues and is only needed for the archive.
      - name: Debounce pushes to master
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch; building ${GITHUB_SHA} without waiting."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Waiting 10 minutes so a burst of merges uploads once."
          sleep 600
          git fetch --no-tags origin master
          head=$(git rev-parse origin/master)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "This commit is still master. Building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # First-parent diffs, so a merge commit counts the files it brought onto master.
          # A web or server commit does not start this workflow, so it must not skip the archive.
          files=$(git log --first-parent --diff-merges=first-parent --name-only --pretty=format: "${GITHUB_SHA}..${head}")
          touched=$(printf '%s\n' "$files" | grep -f scripts/app-paths.txt -e '^\.github/workflows/testflight\.yml$' || true)
          if [ -n "$touched" ]; then
            echo "master is ${head}. A newer commit touches TestFlight paths, so that run archives:"
            printf '%s\n' "$touched"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "master is ${head}, and no newer commit touches app-ios or this workflow. Building ${GITHUB_SHA}."
          echo "build=true" >> "$GITHUB_OUTPUT"

  upload:
    needs: debounce
    if: needs.debounce.outputs.build == 'true'
    # The app builds against the iOS 27 SDK (IndexedEntityQuery, Swift 6.3 rules), which macos-26 images lack.
    # Xcode 27.0 (27A266a) is this image's default, the same build as Stefan's Mac.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-ios
    steps:
      # Full history: scripts/app-version.mts counts the commits for the version Settings shows.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Toolchain
        run: xcodebuild -version

      # The same SwiftPM cache as ios.yml's app job. Saved here on master, it is the one every PR restores first.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('app-ios/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # The key comes from env-manager `prod` through `bun run secrets:github`. It lives outside the repo, as the
      # archive script requires, and is deleted when the job ends.
      - name: App Store Connect API key
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          test -n "$ASC_PRIVATE_KEY_B64" || { echo "ASC_PRIVATE_KEY_B64 is not set; run bun run secrets:github" >&2; exit 1; }
          umask 077
          echo "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # The script uploads the archive's dSYMs to Sentry (org self-uo7, project procrastimate-ios) before App Store
      # Connect, so every TestFlight build symbolicates.
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./scripts/archive

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
