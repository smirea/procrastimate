name: TestFlight processed

# Confirms an uploaded build finished processing in App Store Connect. Does not archive or upload.
# The API key is the same one TestFlight uses. A push of this file checks the Ramble upload
# 2026.1013.215734. A manual run checks the build number you pass.
# The app row is matched after stripping characters that are not part of a bundle id.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/testflight-processed.yml
  workflow_dispatch:
    inputs:
      build_number:
        description: CFBundleVersion already uploaded, such as 2026.1013.215734
        required: true
        type: string

jobs:
  processed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: App Store Connect API key
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          test -n "$ASC_PRIVATE_KEY_B64" || { echo "ASC_PRIVATE_KEY_B64 is not set; run bun run secrets:github" >&2; exit 1; }
          umask 077
          echo "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Wait until the build is processed
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '2026.1013.215734' }}
        run: node scripts/testflight-processed.js

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
