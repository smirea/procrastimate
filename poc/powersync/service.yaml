replication:
  connections:
    - type: postgresql
      uri: postgresql://postgres:postgres@postgres:5432/app
      sslmode: disable
storage:
  type: postgresql
  uri: postgresql://postgres:postgres@postgres:5432/powersync_storage
  sslmode: disable
port: 8080
sync_config:
  path: /config/sync-config.yaml
client_auth:
  jwks_uri: http://host.docker.internal:58081/api/auth/jwks
  audience: ['powersync']
