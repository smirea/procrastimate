# Local Postgres and PowerSync. `scripts/setup-worktree.ts` runs it, never `docker compose` by hand:
#   postgres   one container for every worktree, project `procrastimate`, each worktree in its own database
#   powersync  one container per worktree, project `procrastimate-<worktree>`, on a port from the worktree's block
# Both join the `procrastimate` network, so PowerSync reaches Postgres as `procrastimate-postgres`.
name: procrastimate
services:
  postgres:
    image: postgres:17
    container_name: procrastimate-postgres
    # Logical replication for PowerSync, one slot and sender per worktree. Each worktree holds ~8 connections from
    # PowerSync plus up to 5 per API server (dev and e2e), so 1000 keeps 40+ worktrees clear of "too many clients".
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=64
      - -c
      - max_wal_senders=64
      - -c
      - max_connections=1000
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['127.0.0.1:5440:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [procrastimate]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      timeout: 5s
      retries: 30
  powersync:
    image: journeyapps/powersync-service:1.27.0
    container_name: procrastimate-powersync-${WORKTREE:-unset}
    labels:
      procrastimate.worktree: ${WORKTREE_PATH:-unset}
    command: ['start', '-r', 'unified']
    # PowerSync exits when Postgres restarts and never reconnects on its own.
    restart: unless-stopped
    ports: ['127.0.0.1:${POWERSYNC_PORT:-0}:8080']
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
    volumes:
      - ${POWERSYNC_SERVICE_CONFIG:-/dev/null}:/config/service.yaml:ro
      - ../powersync/sync-config.yaml:/config/sync-config.yaml:ro
    networks: [procrastimate]
networks:
  procrastimate:
    name: procrastimate
volumes:
  pgdata:
    name: procrastimate-pgdata
