# PowerSync Cloud instance procrastimate-dev. Deployed with the PowerSync CLI from `cli.yaml`; the streams are the
# shared `../sync-config.yaml`. The database password comes from env-manager's `POWERSYNC_DATABASE_PASSWORD` (dev).
_type: cloud
name: procrastimate-dev
region: us
replication:
  connections:
    - type: postgresql
      hostname: db.skzsonckjfakmoordlhw.supabase.co
      port: 5432
      database: postgres
      username: powersync_role
      password:
        secret: !env POWERSYNC_DATABASE_PASSWORD
      sslmode: verify-full
client_auth:
  jwks:
    keys:
      - kty: OKP
        kid: procrastimate-dev-2026-10-17
        crv: Ed25519
        x: 7-D3afpGJ3uczICpf9XlNfV55dOevKPmyAWZn5YhnJs
        alg: EdDSA
  additional_audiences: ['powersync']
