# One PowerSync service per worktree, written to the worktree's git-ignored `.powersync/service.yaml` by
# `scripts/local-stack.ts`, which fills in the worktree's database. The public key is the committed
# `INSECURE-dev-jwt-key.json`; production lists its own in `powersync/<env>/service.yaml`.
replication:
  connections:
    - type: postgresql
      uri: postgresql://postgres:postgres@procrastimate-postgres:5432/{{DATABASE}}
      sslmode: disable
storage:
  type: postgresql
  uri: postgresql://postgres:postgres@procrastimate-postgres:5432/{{DATABASE}}_powersync
  sslmode: disable
port: 8080
sync_config:
  path: /config/sync-config.yaml
client_auth:
  jwks:
    keys:
      - kty: OKP
        kid: insecure-local-dev-5d7cc3c8
        crv: Ed25519
        x: DEkzG_aA70UQ6hC0YrN_kHGNrZPL6vkgWpx4KKTdpoA
        alg: EdDSA
  audience: ['powersync']
