pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: '*.{js,ts,jsx,tsx}'
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    oxfmt:
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    generated:
      run: bun run generate:check
    typecheck:
      run: bun run check
    test:
      glob: '*.{js,ts,jsx,tsx,svelte,swift}'
      run: bun --no-env-file scripts/test-changed.ts {staged_files}

pre-push:
  commands:
    test:
      glob: '*.{js,ts,jsx,tsx,svelte,swift}'
      run: bun --no-env-file scripts/test-changed.ts {push_files}
